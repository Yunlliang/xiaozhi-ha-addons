name: XiaoZhi Sherpa-ONNX TTS/STT
version: "0.3.7"
slug: xiaozhi_sherpa_onnx
description: Upstream Sherpa-ONNX Wyoming and OpenAI-compatible speech APIs
url: https://github.com/ptbsare/sherpa-onnx-tts-stt
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
image: ghcr.io/ptbsare/home-assistant-addons/{arch}-addon-sherpa-onnx-tts-stt
options:
  language: zh-CN
  speed: 1.0
  stt_model: sherpa-onnx-paraformer-zh-2023-03-28
  stt_use_int8_onnx_model: true
  stt_builtin_auto_convert_number: false
  stt_use_online_processing: false
  stt_thread_num: 3
  tts_model: matcha-icefall-zh-baker
  tts_thread_num: 3
  tts_speaker_sid: 0
  debug: false
schema:
  language: str
  speed: float
  stt_model: list(sherpa-onnx-paraformer-zh-2023-03-28|sherpa-onnx-paraformer-zh-small-2024-03-09|custom_stt_model)
  stt_use_int8_onnx_model: bool
  stt_builtin_auto_convert_number: bool
  stt_use_online_processing: bool
  stt_thread_num: int
  tts_model: list(matcha-icefall-zh-baker|vits-melo-tts-zh_en|kokoro-int8-multi-lang-v1_1|custom_tts_model)
  tts_thread_num: int
  tts_speaker_sid: int
  debug: bool
  custom_stt_model: str?
  custom_stt_model_eval: str?
  custom_tts_model: str?
  custom_tts_model_eval: str?
ports:
  10400/tcp:
  10500/tcp:
ports_description:
  10400/tcp: Wyoming
  10500/tcp: OpenAI compatible TTS/STT
